<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161B">
<title>نظام الحسابات</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#14161B"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F3EE;--card:#FFFFFF;--ink:#15171C;--mute:#5F6368;--line:#E3E1DA;--line2:#EEECE6;--acc:#0E6B63;--acc2:#0A4F49;--accs:#E3F0EE;--dark:#14161B;--dark2:#1E2127;--dark3:#22252C;--warn:#9A5B00;--warns:#FFF4E0;--bad:#A1361F;--bads:#FBEAE6;--amber:#E0A84E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
a{color:var(--acc)}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.app{display:flex;min-height:100vh;position:relative}
/* sidebar */
.side{flex:0 0 260px;width:260px;background:var(--dark);color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:16px;min-height:100vh;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side .back{color:#9CA1AB;text-decoration:none;font-size:13px;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 6px}
.iconbtn{width:40px;height:40px;border:0;border-radius:10px;background:var(--dark3);color:#C9CCD3;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.co{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--dark2)}
.logo{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;flex:none}
.co .n{font-weight:700;font-size:16px}.co .m{font-size:12px;color:#9CA1AB}
.nav{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:42px;border-radius:10px;color:#C9CCD3;text-decoration:none;font-size:14px}
.nav:hover{background:var(--dark3);color:#fff}
.nav.on{background:var(--acc);color:#fff}
.navsec{font-size:11px;color:#7D828C;padding:10px 12px 4px}
.side .status{margin-top:auto;padding:12px;border-radius:12px;border:1px solid #2A2D35;font-size:12px;color:#9CA1AB;display:flex;flex-direction:column;gap:6px}
.side .status .ok{color:#7FD1C6}.side .status .w{color:#F2C46D}
.side.rail{flex-basis:68px;width:68px;padding:12px 10px;align-items:center}
.side.rail .nav{padding:0;width:48px;justify-content:center}
.side.rail .lbl,.side.rail .navsec,.side.rail .co .txt,.side.rail .status,.side.rail .back span{display:none}
.side.rail .co{padding:3px;background:transparent}
.side.rail .top{flex-direction:column}
.scrim{display:none}
/* main */
.main{flex:1 1 0;min-width:0;padding:24px 28px 60px;display:flex;flex-direction:column;gap:20px}
.mtop{display:none}
h1{margin:0;font-size:28px;font-weight:700}
h2{margin:0;font-size:18px;font-weight:700}
.sub{font-size:13px;color:var(--mute)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.g-f2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-f3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:8px}
.kpi .v{font-size:28px;font-weight:700;text-align:right}
.kpi.t{background:var(--acc);color:#fff;border:0}.kpi.t .sub{color:#CFE8E4}
.kpi.d{background:var(--dark);color:#fff;border:0}.kpi.d .sub{color:#B9BDC6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.p{background:var(--dark);color:#fff;border-color:var(--dark);font-weight:600}
.btn.a{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.btn.r{color:var(--bad);border-color:#E8C4BC}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:0 14px;min-height:40px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--dark);color:#fff;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 14px;min-height:38px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:600}
.chip.g.on{background:var(--accs);border-color:var(--acc);color:var(--acc2)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute);min-width:0}
.in{height:46px;padding:0 12px;border:1px solid #D9D6CE;border-radius:12px;background:#fff;width:100%;min-width:0}
textarea.in{height:auto;padding:10px 12px;min-height:70px}
.in:focus{outline:2px solid var(--acc);outline-offset:-1px}
.in.big{height:60px;font-size:26px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{flex:1}
table{width:100%;border-collapse:collapse}
th{padding:10px 12px;font-size:12px;font-weight:600;color:var(--mute);text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFAF7;position:sticky;top:0}
td{padding:11px 12px;font-size:14px;border-bottom:1px solid var(--line2);white-space:nowrap}
td.l,th.l{text-align:left}
tr.tot td{background:#F4F3EE;font-weight:700}
tr.click{cursor:pointer}tr.click:hover td{background:#FAFAF7}
.tw{overflow-x:auto;border-radius:12px}
.tag{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;background:var(--line2);color:var(--mute)}
.tag.a{background:var(--accs);color:var(--acc2)}.tag.w{background:var(--warns);color:#7A4A00}.tag.r{background:var(--bads);color:var(--bad)}
.up{color:var(--bad)}.down{color:var(--acc)}
.note{padding:12px 16px;border-radius:12px;background:var(--accs);color:var(--acc2);font-size:14px;line-height:1.7}
.note.w{background:var(--warns);color:#7A4A00}.note.r{background:var(--bads);color:var(--bad)}
.empty{padding:40px 20px;text-align:center;color:var(--mute);line-height:1.8}
.toggle{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 14px 0 6px;min-height:42px;cursor:pointer}
.toggle i{width:36px;height:20px;border-radius:999px;background:#BDB9AE;position:relative;flex:none}
.toggle i:after{content:'';position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on i{background:var(--acc)}.toggle.on i:after{right:18px}
.bar{height:8px;border-radius:999px;background:var(--line2);overflow:hidden}.bar>div{height:100%;background:var(--acc);border-radius:999px}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.list .it:last-child{border-bottom:0}
.modal{position:fixed;inset:0;background:rgba(20,22,27,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal .box{background:#fff;border-radius:18px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 20px;border-radius:12px;z-index:200;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.homewrap{max-width:1100px;margin:0 auto;padding:40px 32px;display:flex;flex-direction:column;gap:28px}
.homehead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 32px;border-bottom:1px solid var(--line);background:#fff}
.cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px}
.cocard{display:flex;flex-direction:column;gap:18px;padding:22px;border-radius:20px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);min-height:190px}
.cocard.add{border:1.5px dashed #BDB9AE;align-items:center;justify-content:center;background:transparent}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #D9D6CE;border-radius:16px;padding:0 18px;height:60px;color:var(--mute)}
.search input{flex:1;border:0;outline:0;font-size:18px;background:transparent;min-width:0;height:100%}
svg text{font-family:inherit}
@media (max-width:820px){
 .side{position:fixed;right:0;top:0;bottom:0;z-index:50;transform:translateX(100%);transition:transform .2s;height:100%}
 .side.open{transform:none}
 .side.rail{transform:translateX(100%)}
 .scrim.open{display:block;position:fixed;inset:0;background:rgba(20,22,27,.45);z-index:40}
 .main{padding:0 14px 90px;gap:16px}
 .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:20}
 .mtop .iconbtn{background:#fff;border:1px solid var(--line);color:var(--ink)}
 h1{font-size:22px}
 .g-f2,.g-f3{grid-template-columns:minmax(0,1fr)}
 .homewrap{padding:20px 16px}.homehead{padding:12px 16px}
 .card{padding:16px}
 .kpi .v{font-size:22px}
 .hide-m{display:none}
}
@media print{
 .side,.mtop,.scrim,.noprint{display:none!important}
 .main{padding:0}
 .card{border:0;padding:0}
 body{background:#fff}
 th{position:static}
}
body.ro #mEdit,body.ro #mDel,body.ro [data-del],body.ro [data-edit],body.ro .cocard.add,body.ro #demoBtn,body.ro #srSave,body.ro [data-srdel],body.ro #bkUp,body.ro label:has(#bkUp),body.ro [data-snap],body.ro #fhNew,body.ro label:has(#coUp),body.ro #fhRe,body.ro .mtop a.iconbtn,body.ro .homehead a[href="#/data"]{display:none!important}
.bulk td{padding:5px 4px;vertical-align:top}.bulk .in{padding:8px 10px;font-size:14px}.bulk tr.bad td{background:var(--bads)}.sum{display:flex;gap:10px;flex-wrap:wrap}.pill{background:var(--accs);color:var(--acc);border-radius:12px;padding:9px 14px;font-weight:600}.pill.dk{background:var(--dark);color:#fff}.plar{display:inline-block;width:16px;color:var(--mute);font-size:12px}.plt tr.pls td:first-child{font-weight:600}.plt tr.plg td{background:#FBFAF6;font-size:14px}.plt tr.pld td{font-size:13.5px;color:#3A3D44}.plt a.placc{color:inherit;text-decoration:none;border-bottom:1px dashed var(--line)}.plt a.placc:hover{color:var(--acc)}
/* v3.6 — drill-down panel, report hierarchy, light motion */
[data-dd]{cursor:pointer}
td[data-dd]{transition:background .15s,color .15s}
td[data-dd]:hover{background:#FFF4DC !important;color:#7A4A00}
tr.tot td[data-dd]:hover{color:#7A4A00}
.ddk{cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
.ddk:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,22,27,.08)}
.ddi{cursor:pointer;border-radius:8px;transition:background .15s}
.ddi:hover{background:#FFF4DC}
.ddbar{cursor:pointer;transition:opacity .15s}.ddbar:hover{opacity:.7}
.ddov{position:fixed;inset:0;z-index:90}
.ddbg{position:absolute;inset:0;background:rgba(20,22,27,.38);animation:ddFade .2s ease both}
.ddp{position:absolute;top:0;bottom:0;left:0;width:min(660px,100%);background:#fff;box-shadow:16px 0 48px rgba(0,0,0,.2);padding:22px;overflow:auto;animation:ddIn .26s cubic-bezier(.2,.8,.2,1) both}
.ddov.out .ddbg{animation:ddFade .18s ease reverse both}.ddov.out .ddp{animation:ddIn .18s ease reverse both}
@keyframes ddFade{from{opacity:0}to{opacity:1}}
@keyframes ddIn{from{transform:translateX(-100%)}to{transform:none}}
body.ddlock{overflow:hidden}
.ddpill{background:var(--accs);color:var(--acc);border-radius:10px;padding:6px 12px;font-weight:600;font-size:13px}
.ddpill.ok{background:#E3F3EA;color:#1D6B3A}.ddpill.bad{background:var(--bads);color:var(--bad)}
.ddtw{overflow-x:auto}
.ddt{width:100%;border-collapse:collapse}.ddt th{font-size:12.5px;color:var(--mute);font-weight:500;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}.ddt th.l{text-align:left}
.ddt td{padding:8px 6px;border-bottom:1px solid var(--line2);font-size:13.5px;vertical-align:top}
.ddt tbody tr:not(.tot):hover td{background:#FAF9F5}
.ddopen{border:0;background:none;color:var(--acc);font-weight:600;font-size:12.5px;cursor:pointer;padding:2px 4px;white-space:nowrap}
.ddopen:hover{text-decoration:underline}
/* income statement hierarchy */
.plt tr.pls td{background:#F1EFE8;font-weight:700;border-bottom:1px solid var(--line)}
.plt tr.pls td:first-child{font-size:15.5px}
.plt tr.plg td{background:#fff;font-weight:600;font-size:14.5px}
.plt tr.plg td:first-child{box-shadow:inset -4px 0 0 var(--acc)}
.plt tr.pld td{font-size:13.5px;color:#4A4E57;background:#FCFBF8;font-weight:400}
.plt tr.pld td:first-child:before{content:'•';color:#B5B2A8;margin-left:8px}
.plt tr.plgp td{background:#E9F3F1;color:var(--acc);font-weight:700}
.plt tr.tot td{background:var(--dark);color:#fff;font-size:15.5px}
.plt tr.tot td:first-child{border-radius:0 12px 12px 0}.plt tr.tot td:last-child{border-radius:12px 0 0 12px}
.plar{transition:transform .2s}
tr.rin td{animation:rowIn .28s ease both}
@keyframes rowIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
tr.rgrp td{background:var(--bg)}
tr.rdet td{font-size:14px;color:#3A3D44}
/* light motion */
main.enter>*{animation:fadeUp .34s ease both}
main.enter>*:nth-child(2){animation-delay:.04s}main.enter>*:nth-child(3){animation-delay:.08s}main.enter>*:nth-child(4){animation-delay:.12s}main.enter>*:nth-child(n+5){animation-delay:.16s}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn,.chip{transition:transform .12s ease,background .15s,box-shadow .15s}
.btn:active,.chip:active{transform:scale(.97)}
tbody tr td{transition:background .15s}
.click:hover td{background:#F7F5EF}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media print{.ddov{display:none !important}*{animation:none !important}.plt tr.tot td{background:#eee !important;color:#000 !important}}
</style>
</head>

<script>
'use strict';
const APP_VERSION = '3.7.0';
// ---------- helpers
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const r2 = (n) => Math.round((+n + Number.EPSILON) * 100) / 100;
const SHOWDEC = () => { try { return localStorage.getItem('hesabat-dec') !== '0'; } catch (e) { return true; } };
const f0 = (n) => SHOWDEC() ? (+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : Math.round(+n || 0).toLocaleString('en-US');
const fk = (n) => Math.round(+n || 0).toLocaleString('en-US'); // whole numbers (chart axes)
const f2 = (n) => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pad = (n) => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const ym = (d) => d.slice(0, 7);
const ymLabel = (k) => MONTHS[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4);
const ymShort = (k) => MONTHS[+k.slice(5, 7) - 1];
const addMonths = (k, n) => { let y = +k.slice(0, 4), m = +k.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + pad(m + 1); };
const monthRange = (from, to) => { const out = []; let k = from; let g = 0; while (k <= to && g++ < 240) { out.push(k); k = addMonths(k, 1); } return out; };
const num = (v) => { const x = parseFloat(String(v ?? '').replace(/,/g, '').replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))); return isFinite(x) ? x : 0; };

const ERRORS = [];
window.addEventListener('error', (e) => { ERRORS.push({ t: new Date().toISOString(), m: String(e.message), s: (e.filename || '') + ':' + (e.lineno || '') }); });
window.addEventListener('unhandledrejection', (e) => { ERRORS.push({ t: new Date().toISOString(), m: String(e.reason && e.reason.message || e.reason) }); });

const ICON = {

  rev: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',

  swap: '<path d="M7 7h13l-4-4M17 17H4l4 4"/>',
  cash: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  book: '<path d="M4 4h12a4 4 0 014 4v12H8a4 4 0 01-4-4V4z"/><path d="M8 8h8M8 12h6"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  trend: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/>',
  scale: '<path d="M12 3v18M5 7h14M5 7l-3 7a3.5 3.5 0 006 0L5 7zM19 7l-3 7a3.5 3.5 0 006 0l-3-7z"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  db: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  coll: '<path d="M9 6l6 6-6 6"/><path d="M4 4v16"/>',
  expd: '<path d="M15 6l-6 6 6 6"/><path d="M20 4v16"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/>',
  dl: '<path d="M12 4v12M6 10l6 6 6-6M4 20h16"/>',
  print: '<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2"/><rect x="6" y="14" width="12" height="7"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/>',

// ---------- data, backup & health
function healthCheck() {
  const issues = [];
  DB.companies.forEach((c) => {
    const b = book(c.id); if (!b) { issues.push(c.name + ': ملف الحسابات ناقص'); return; }
    let D = 0, C = 0; const seen = new Set();
    b.entries.forEach((e) => {
      if (!entryBalanced(e)) issues.push(c.name + ': الحركة رقم ' + e.no + ' غير متوازنة');
      e.lines.forEach((l) => { D += l.dr; C += l.cr; if (!acc(b, l.a)) issues.push(c.name + ': الحركة رقم ' + e.no + ' عليها حساب محذوف'); if (l.b && !b.branches.find((x) => x.id === l.b)) issues.push(c.name + ': الحركة رقم ' + e.no + ' عليها فرع محذوف'); });
      if (e.kind === 'rev' && e.meta) { const k = e.date + '|' + e.meta.br; if (seen.has(k)) issues.push(c.name + ': إيراد مكرر للفرع نفسه يوم ' + e.date + ' (راجعه)'); seen.add(k); }
    });
    if (Math.abs(D - C) > 0.01) issues.push(c.name + ': إجمالي المدين لا يساوي الدائن');
  });
  return issues;
}

// ---------- boot
(async function boot() {
  await Store.open();
  const raw = await Store.get('db');
  if (raw) { try { DB = JSON.parse(raw); } catch (e) { ERRORS.push({ t: new Date().toISOString(), m: 'db parse: ' + e.message }); } }
  Object.values(DB.books || {}).forEach((bk) => { try { migrateTree(bk); ensureSys2(bk); } catch (e) { ERRORS.push({ t: new Date().toISOString(), m: 'migrate: ' + e.message }); } });
  const fh = await Store.get('fh');
  if (fh) { Store.fh = fh; try { Store.fileOk = (await fh.queryPermission({ mode: 'readwrite' })) === 'granted'; } catch (e) { Store.fileOk = false; } }
  UI._n = isNarrow();
  if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) { } }
  render();
  if (typeof Cloud !== 'undefined' && Cloud.on) Cloud.start();
})();

// ---------- sales channels on journal lines (new entries carry l.ch; older ones are read from the line text)
function chByName(b, n) {
  const s = String(n || '').replace(/^(إيراد|عمولة) /, '');
  const c = b.channels.slice().sort((x, y) => y.name.length - x.name.length).find((ch) => s === ch.name || s.startsWith(ch.name + ' '));
  return c ? c.id : null;
}
function lineCh(b, l) { return l.ch || (/^(إيراد|عمولة) /.test(l.n || '') ? chByName(b, l.n) : null); }
const chName = (b, id) => { const c = b.channels.find((x) => x.id === id); return c ? c.name : 'بدون قناة'; };
function revGross(b, e) { // {chId: gross} for a daily revenue entry
  const com = (sysAcc(b, 'commission') || {}).id, g = {};
  e.lines.forEach((l) => { if (l.dr > 0 && l.a !== com && /^إيراد /.test(l.n || '') || (l.ch && l.dr > 0 && l.a !== com && !l.sec)) { const k = lineCh(b, l); if (k) g[k] = (g[k] || 0) + l.dr; } });
  if (!Object.keys(g).length && e.meta && e.meta.amts) Object.keys(e.meta.amts).forEach((k) => { const v = num(e.meta.amts[k]); if (v) g[k] = v; });
  return g;
}
function lineParts(b, e, l, a) { // split a line by channel: [{ch, f}]
  if (e.kind === 'rev' && a.type === 'revenue') {
    const g = revGross(b, e); const t = Object.values(g).reduce((x, y) => x + y, 0);
    if (t) return Object.keys(g).map((k) => ({ ch: k, f: g[k] / t }));
  }
  return [{ ch: lineCh(b, l) || '_', f: 1 }];
}
